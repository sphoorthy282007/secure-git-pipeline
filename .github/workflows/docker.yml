name: Secure Docker Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build image
        run: docker build -t YOUR_DOCKERHUB_USERNAME/myapp:${GITHUB_SHA} .

      - name: Push image
        run: docker push YOUR_DOCKERHUB_USERNAME/myapp:${GITHUB_SHA}
